services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: xoult
      POSTGRES_PASSWORD: xoult
      POSTGRES_DB: xoult
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xoult"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
