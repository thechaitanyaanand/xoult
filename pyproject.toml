[project]
name = "xoult"
version = "0.1.0"
description = "Personalized daily arXiv feed: a recommender with LLM-written TLDRs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1",
    "google-auth[requests]>=2.62.0",
    "itsdangerous>=2.2.0",
    "numpy>=2.5.4",
    "pgvector>=0.3",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.2.4",
    "sentry-sdk[fastapi]>=2.72.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
ingest = [
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "litellm>=1.105.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "tenacity>=9.2.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.7",
]
eval = [
    "rouge-score>=0.1.2",
    "scikit-learn>=1.9.1",
    "scipy",
]

[tool.uv]
default-groups = ["dev", "eval"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
