<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="xoult">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{origin}}/static/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M7 17l6 6L25 9' fill='none' stroke='%232b4bd6' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  /* A plain, server-rendered reading list for search engines and no-JS readers; the
     look follows index.html without its fonts or app styles. */
  :root { --paper: #f7f8fa; --ink: #1b2030; --muted: #5e6677; --rule: #e2e5eb; --accent: #2b4bd6; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #151821; --ink: #e7e9ef; --muted: #9aa1b1; --rule: #2a2f3b; --accent: #8ea2ff; color-scheme: dark; }
  }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.55 Charter, Georgia, serif; }
  main { max-width: 46rem; margin: 0 auto; padding: 2rem 1rem 5rem; }
  a { color: inherit; }
  header { padding-bottom: 0.75rem; border-bottom: 1px solid var(--ink); }
  .wordmark { font-size: 1.75rem; font-weight: 600; text-decoration: none; }
  h1 { font-size: 1.5rem; line-height: 1.25; margin: 1.5rem 0 0.5rem; }
  .lede, .meta, nav { color: var(--muted); font: 0.875rem/1.6 system-ui, sans-serif; }
  .cta { color: var(--accent); font-weight: 500; }
  ol { list-style: none; margin: 1.5rem 0 0; padding: 0; }
  li { padding: 1.1rem 0; border-bottom: 1px solid var(--rule); }
  h2 { margin: 0; font-size: 1.125rem; line-height: 1.3; font-weight: 600; }
  h2 a { text-decoration: none; }
  h2 a:hover { text-decoration: underline; }
  li p { margin: 0.4rem 0 0; }
  nav { margin-top: 2.5rem; }
  nav a { margin-right: 0.75rem; }
</style>
</head>
<body>
<main>
  <header><a class="wordmark" href="/">xoult</a></header>
  {{body}}
</main>
</body>
</html>
