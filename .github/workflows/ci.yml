name: ci

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to commit SHAs: a tag can be moved to new code, a SHA can't.
# Dependabot (monthly) bumps them.
permissions:
  contents: read

env:
  FASTEMBED_CACHE_PATH: .cache/fastembed

jobs:
  test:
    runs-on: ubuntu-latest
    # A throwaway database so tests/test_api.py exercises real SQL and pgvector.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: xoult
          POSTGRES_PASSWORD: xoult
          POSTGRES_DB: xoult_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xoult"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://xoult:xoult@localhost:5432/xoult_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  ranking-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      # Embedding 17k papers takes a few minutes; reuse them until the embedding code
      # changes. baseline.json names the model, so it changes whenever the model does.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            data/citeulike-a
            .cache/fastembed
          key: citeulike-${{ hashFiles('src/xoult/embed.py', 'evals/baseline.json') }}
      - run: uv run python -m evals.rank_eval --check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t xoult .
      - name: API starts and imports without the ingest extras
        run: docker run --rm xoult python -c "import xoult.api"
