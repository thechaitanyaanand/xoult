name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  FASTEMBED_CACHE_PATH: .cache/fastembed

jobs:
  test:
    runs-on: ubuntu-latest
    # A throwaway database so tests/test_api.py exercises real SQL and pgvector.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: xoult
          POSTGRES_PASSWORD: xoult
          POSTGRES_DB: xoult_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xoult"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://xoult:xoult@localhost:5432/xoult_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  ranking-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      # Embedding 17k papers takes a few minutes; reuse them until the embedding code
      # or config changes.
      - uses: actions/cache@v4
        with:
          path: |
            data/citeulike-a
            .cache/fastembed
          key: citeulike-${{ hashFiles('src/xoult/embed.py', 'src/xoult/config.py') }}
      - run: uv run python -m evals.rank_eval --check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t xoult .
      - name: API starts and imports without the ingest extras
        run: docker run --rm xoult python -c "import xoult.api"
