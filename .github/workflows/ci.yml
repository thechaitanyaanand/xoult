name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  FASTEMBED_CACHE_PATH: .cache/fastembed

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  ranking-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      # Embedding 17k papers takes a few minutes; reuse them until the embedding code
      # or config changes.
      - uses: actions/cache@v4
        with:
          path: |
            data/citeulike-a
            .cache/fastembed
          key: citeulike-${{ hashFiles('src/xoult/embed.py', 'src/xoult/config.py') }}
      - run: uv run python -m evals.rank_eval --check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t xoult .
      - name: API starts and imports without the ingest extras
        run: docker run --rm xoult python -c "import xoult.api"
