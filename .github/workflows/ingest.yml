name: ingest

on:
  # arXiv announces Sunday-Thursday evenings US Eastern; the feed is rebuilt by about
  # 06:00 UTC the next morning. The afternoon run finds nothing new to fetch, but writes
  # TLDRs for papers people were shown since the morning (see NEEDS_TLDR in ingest.py).
  schedule:
    - cron: "0 7 * * 1-5"
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      # Sent by the API when a reader saves a paper that isn't embedded yet (api.py).
      embed_only:
        description: Only embed papers that lack a vector
        type: boolean
        default: false

# Its own group, so a burst of saves can't cancel a queued daily run. Overlapping with
# one is harmless: both write the same vectors for the same papers.
concurrency: ${{ inputs.embed_only && 'embed' || 'ingest' }}

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FASTEMBED_CACHE_PATH: .cache/fastembed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra ingest --no-default-groups
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/fastembed
          key: fastembed-${{ hashFiles('evals/baseline.json') }}
      # Secrets go to this step only, never to the third-party actions above, so a
      # compromised action release can't read them.
      - name: Ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLAMA_API_KEY: ${{ secrets.LLAMA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
          EMBED_ONLY: ${{ inputs.embed_only }}
        run: |
          missing=""
          [ -z "$DATABASE_URL" ] && missing="$missing DATABASE_URL"
          [ -z "$GROQ_API_KEY$GEMINI_API_KEY$OPENROUTER_API_KEY" ] && [ "$EMBED_ONLY" != true ] && missing="$missing GROQ_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          uv run python -m xoult.db
          if [ "$EMBED_ONLY" = true ]; then
            uv run python -m xoult.ingest --embed-only
          else
            uv run python -m xoult.ingest
          fi
